name: Claude review

# On-demand AI review using the Claude Code GitHub Action, billed against a
# Claude subscription (not an API key). It never runs automatically on a PR;
# a maintainer asks for it:
#   - add the `claude-review` label to a PR, or
#   - comment `@claude` (for example `@claude review`) on a PR.
#
# One-time setup (needs a human, not an agent):
#   1. Run `claude setup-token` locally and copy the token.
#   2. Add it as the repository secret CLAUDE_CODE_OAUTH_TOKEN.
#   3. Create a `claude-review` label.
# Without the secret the jobs fail harmlessly. Do not also set ANTHROPIC_API_KEY
# here, or runs may bill as API usage instead of the subscription.
#
# Reviews are advisory and never replace human review (see AI_POLICY.md).
# Pull requests from forks do not receive repository secrets, so the label
# trigger only works for branches in this repository.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  review-label:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'claude-review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md first and apply its ground
            rules. Prioritise correctness: wrong prime/composite verdicts, limb or
            carry errors, WGSL that assumes 64-bit integers in the 13-bit path,
            panics or hangs on device loss, undocumented `unsafe`, kernel changes
            without a differential test against the CPU reference, invented
            performance numbers, and machine-identifying details. Skip style nits
            that rustfmt or clippy would catch. Be concise; use inline comments
            for specific lines and one summary comment for the rest.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  review-mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
