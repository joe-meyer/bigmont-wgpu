name: Release

# Cut a release by pushing a SemVer tag, e.g.:
#   v0.1.0-alpha.1   (published as a GitHub pre-release)
#   v0.1.0           (published as a normal release)
#
# The version comes from [workspace.package] in the root Cargo.toml, which all
# crates inherit; the tag must match it exactly.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Hosted runners have no GPU: turn the strict GPU tests' missing-adapter
  # failures into skips. The real GPU verification happens before tagging.
  BIGMONT_ALLOW_SKIP: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      has_bins: ${{ steps.meta.outputs.has_bins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml
        id: meta
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          meta=$(cargo metadata --no-deps --format-version 1)
          # All workspace members inherit one version; require that, then compare.
          versions=$(jq -r '[.packages[].version] | unique | join(",")' <<<"$meta")
          if [[ "$versions" == *,* ]]; then
            echo "::error::Workspace crates have differing versions: $versions"
            exit 1
          fi
          if [[ "$tag_version" != "$versions" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $versions"
            exit 1
          fi
          bins=$(jq -r '[.packages[].targets[] | select(.kind[]=="bin")] | length' <<<"$meta")
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$tag_version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_bins=$([[ "$bins" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check changelog mentions this version
        run: |
          grep -q "\[${{ steps.meta.outputs.version }}\]" CHANGELOG.md \
            || echo "::warning::CHANGELOG.md has no entry for ${{ steps.meta.outputs.version }}"
      - run: cargo test --workspace --all-features --locked --no-fail-fast -- --test-threads=1

  build:
    name: build (${{ matrix.target }})
    needs: verify
    if: needs.verify.outputs.has_bins == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p bigmont-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="bigmont-wgpu-${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          exe=""; [[ "${{ matrix.target }}" == *windows* ]] && exe=".exe"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/bigmont${exe}" "dist/$name/"
          cp LICENSE* README* CHANGELOG.md "dist/$name/" 2>/dev/null || true
          cd dist
          if [[ -n "$exe" ]]; then 7z a "$name.zip" "$name" >/dev/null
          else tar czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    # Run even when `build` was skipped (library with no binaries).
    if: always() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        if: needs.build.result == 'success'
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        if: needs.build.result == 'success'
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
          [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]] && flags+=(--prerelease)
          files=()
          [[ -d dist ]] && files=(dist/*)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" "${files[@]}"

  # crates.io publishing is intentionally not wired up: the workspace crates
  # depend on each other by `path` only (no `version`), and the root manifest is
  # a virtual workspace, so a bare `cargo publish` cannot work. Revisit when
  # (and if) the crates are prepared for crates.io.
