name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The GPU tests are strict by default (a missing adapter or capability fails
  # the test). Most hosted runners have no usable GPU, so turn missing ones into
  # loud skips.
  BIGMONT_ALLOW_SKIP: "1"
  # Every skip is also appended to this file, and the jobs summarise it
  # (.github/scripts/skip_summary.py), so a green run says how much of the GPU
  # suite did not run.
  BIGMONT_SKIP_LOG: ${{ github.workspace }}/bigmont-skips.log

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The workspace tests on each OS's default adapter. The Linux and Windows runners
  # have no usable GPU, so the GPU-dependent tests skip there (BIGMONT_ALLOW_SKIP=1)
  # and the summary step lists them; the macOS runner has a Metal device, so those
  # tests run for real. The `gpu-software` job runs them against a software Vulkan
  # device. See https://github.com/joe-meyer/bigmont-wgpu/issues/23.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo build --workspace --all-features --locked
      - name: Adapter report
        run: cargo run --locked -q -p bigmont-core --example adapter_report
      # nextest runs each test in its own process, with the per-test timeout and
      # serial scheduling set in .config/nextest.toml. It does not run doctests.
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast
      - run: cargo test --workspace --all-features --locked --doc
      - name: Summarise skipped tests
        if: always()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/skip_summary.py "$BIGMONT_SKIP_LOG" "test (${{ matrix.os }})"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-test-${{ matrix.os }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

  # Exercises the real wgpu code path using a software Vulkan device (lavapipe),
  # since hosted runners have no GPU. lavapipe reports subgroup size 8, so kernels
  # needing tpi 16/32 skip (the first run showed those fail strictly); the rest run
  # for real. The summary step lists what was skipped, and fails the job if the
  # software device is missing or lacks subgroups, because then it would silently
  # stop covering the GPU path. LVP_POISON_MEMORY makes lavapipe fill new memory
  # with a non-zero value, so a kernel or runner that reads memory it never wrote
  # fails instead of passing on fresh zero pages.
  #
  # The Linux leg is blocking. The Windows leg (lavapipe built for Windows) is new
  # and non-blocking until it has proven stable; it exists because WARP, the only
  # adapter a Windows runner has otherwise, lacks subgroups.
  gpu-software:
    name: gpu-software (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    env:
      BIGMONT_BACKEND: Vulkan
      LVP_POISON_MEMORY: "true"
      # Mesa's Windows build (pal1000/mesa-dist-win), pinned by version and checked
      # against the release asset's published SHA-256 before it is used.
      MESA_VERSION: "26.2.6"
      MESA_SHA256: b2e00615feaba45942343c265cc8c5f576142ca682c1ac6661922d4b72492877
      # The Vulkan SDK (loader) wgpu's own CI installs on Windows runners that have none.
      VULKAN_SDK_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Install software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          vulkaninfo --summary || true
      - name: Install software Vulkan (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # A runner with no GPU driver may have no Vulkan loader either.
          if [ -f /c/Windows/System32/vulkan-1.dll ]; then
            echo "Vulkan loader already present"
          else
            curl.exe -L --fail --retry 5 --retry-all-errors \
              "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$VULKAN_SDK_VERSION.exe" \
              -o vulkan-sdk-installer.exe
            ./vulkan-sdk-installer.exe --accept-licenses --default-answer --confirm-command install
          fi
          curl.exe -L --fail --retry 5 --retry-all-errors \
            "https://github.com/pal1000/mesa-dist-win/releases/download/$MESA_VERSION/mesa3d-$MESA_VERSION-release-msvc.7z" \
            -o mesa.7z
          echo "$MESA_SHA256  mesa.7z" | sha256sum -c -
          7z.exe l mesa.7z | grep -i -E "vulkan_lvp|lvp_icd|libgallium|libglapi|opengl32" || true
          7z.exe e mesa.7z -omesa 'x64/vulkan_lvp.dll' 'x64/lvp_icd.x86_64.json' \
            'x64/libgallium_wgl.dll' 'x64/libglapi.dll' 'x64/opengl32.dll'
          ls -l mesa
          echo "--- shipped ICD manifest:"
          cat mesa/lvp_icd.x86_64.json
          echo
          # A manifest that names the DLL by absolute path, so the loader does not depend on the
          # DLL search order.
          lib=$(cygpath --windows "$PWD/mesa/vulkan_lvp.dll" | sed 's/\\/\\\\/g')
          printf '{"file_format_version":"1.0.1","ICD":{"library_path":"%s","api_version":"1.3.0"}}\n' "$lib" > mesa/icd.json
          echo "--- ICD manifest in use:"
          cat mesa/icd.json
          echo "$(cygpath --windows "$PWD/mesa")" >> "$GITHUB_PATH"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
      # Register the driver the way a Windows GPU driver does. The VK_DRIVER_FILES environment
      # variable is no use here: the Vulkan loader ignores it in an elevated process, and the
      # runner's user is an administrator (the loader's debug output showed it going straight to
      # this registry key and finding it empty).
      - name: Register lavapipe with the Vulkan loader (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Join-Path $PWD 'mesa\icd.json'
          $key = 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name $manifest -PropertyType DWord -Value 0 -Force | Out-Null
          Get-ItemProperty -Path $key | Format-List
          (Get-Item C:\Windows\System32\vulkan-1.dll).VersionInfo | Format-List FileVersion
      - run: cargo build --workspace --all-features --locked
      - name: Adapter report
        run: cargo run --locked -q -p bigmont-core --example adapter_report
        env:
          # Says why the Vulkan loader skips a driver (Windows only: the Linux leg works).
          VK_LOADER_DEBUG: ${{ runner.os == 'Windows' && 'error,warn,driver' || '' }}
      - run: cargo nextest run --workspace --all-features --locked --no-fail-fast
      - run: cargo test --workspace --all-features --locked --doc
      - name: Summarise skipped tests
        if: always()
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" .github/scripts/skip_summary.py "$BIGMONT_SKIP_LOG" "gpu-software (${{ matrix.os }})" \
            --fail-on 'no (int64 )?adapter|lacks subgroup|SUBGROUP'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-gpu-software-${{ matrix.os }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

  # The engine must keep compiling for the browser (wasm32 + WebGPU). This only
  # checks that it builds: running on a GPU in a browser needs a wgpu fix and a
  # real browser, see web/README.md.
  wasm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p bigmont-oracle -p bigmont-cpu -p bigmont-core -p bigmont-wasm --target wasm32-unknown-unknown --locked

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
