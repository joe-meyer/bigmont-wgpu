[package]
name = "bigmont-core"
description = "Portable (wgpu) 2048-bit Montgomery arithmetic kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bigmont-oracle = { path = "../bigmont-oracle" }
bytemuck = { version = "1.25.2", features = ["derive"] }
num-bigint = "0.5"
num-traits = "0.2"
web-time = "1"
# Pinned to wgpu trunk for gfx-rs/wgpu#10265 (merged 2026-10-10): the web backend maps the browser's
# `subgroups` feature to `Features::SUBGROUP`, which the browser build needs. Released wgpu 30.0.2 lacks it.
# Go back to a crates.io version (`wgpu = "31"` or the first release with #10265) once one ships.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "60cef2be828e03ba54e2e1598001b4625c0c2163" }

# Only for `Gpu::open`, which holds the open lock while it blocks on `open_async` (a browser cannot
# block, so it gets none). Everything else in this crate is async; callers block themselves.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.3"

[dev-dependencies]
ash = "0.38"
naga = { version = "30.0.2", features = ["wgsl-in", "spv-out"] }
