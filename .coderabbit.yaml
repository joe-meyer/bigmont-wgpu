# CodeRabbit: free AI pull request review for public repositories.
# Needs the CodeRabbit GitHub App installed on this repo; this file only
# configures it. Reviews are advisory and never replace human review
# (see AI_POLICY.md).
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Generated WGSL; review the generator, not its output.
    - "!web/kernels/**"
  path_instructions:
    - path: "crates/bigmont-core/src/**"
      instructions: |
        Correctness beats speed: a wrong prime/composite verdict is a regression.
        WGSL has no add-with-carry, no extended multiply and no 64-bit integers on
        WebGPU. The 32-bit-limb kernels need SHADER_INT64 and are native-only; the
        13-bit kernels must not need it. Check that limb ranges and carry handling
        are commented and that device features are checked before use. GPU calls
        can fail or reset mid-run, so flag any panic, unwrap or hang on that path.
        Limb scheme, TPI and autotune changes are welcome, but results vary by GPU
        vendor and driver. Check that the PR description's "Tested on" section
        names the vendors tested and not tested, and note any vendor-specific
        assumption in the code.
    - path: "crates/**/src/**"
      instructions: |
        Flag `unsafe` without a comment stating the invariant on the line above.
        Flag machine-identifying details (hostnames, usernames, serials, local
        paths) and any performance number that is not backed by a named GPU,
        driver and command.
    - path: "crates/**/tests/**"
      instructions: |
        Kernel or arithmetic changes need a differential test against the CPU
        reference (bigmont-oracle / bigmont-cpu), including small moduli, values
        near limb boundaries and carry-overflow paths. GPU tests are strict by
        default; skipping is only allowed via BIGMONT_ALLOW_SKIP=1.
    - path: ".github/workflows/release.yml"
      instructions: |
        Release configuration. Flag any change here for explicit maintainer review.
